<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Картотека Витапром</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper: #e6e2d4;
    --paper-raised: #f2efe3;
    --ink: #262319;
    --ink-soft: #6b6455;
    --ink-faint: #96907d;
    --line: #cac3ac;
    --accent: #8f3324;
    --accent-ink: #fbf3ea;
    --accent-2: #3c4f3f;
    --accent-2-ink: #f1efe2;
    --focus: #1c5b8f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #1c1a15;
      --paper-raised: #262319;
      --ink: #ece6d6;
      --ink-soft: #b0a892;
      --ink-faint: #766f5c;
      --line: #3c3626;
      --accent: #d67a5f;
      --accent-ink: #241209;
      --accent-2: #7fa084;
      --accent-2-ink: #101a12;
      --focus: #7fbce8;
    }
  }
  :root[data-theme="dark"]{
    --paper: #1c1a15;
    --paper-raised: #262319;
    --ink: #ece6d6;
    --ink-soft: #b0a892;
    --ink-faint: #766f5c;
    --line: #3c3626;
    --accent: #d67a5f;
    --accent-ink: #241209;
    --accent-2: #7fa084;
    --accent-2-ink: #101a12;
    --focus: #7fbce8;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"PT Sans", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .page{
    max-width:760px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  .drawer{
    background:var(--accent);
    color:var(--accent-ink);
    padding:22px 28px;
    display:flex;
    flex-direction:column;
    gap:6px;
    box-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  .drawer .eyebrow{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.85;
  }
  .drawer h1{
    margin:0;
    font-family:"PT Serif", Georgia, serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 38px);
    text-wrap:balance;
    letter-spacing:.01em;
  }
  .drawer p{
    margin:2px 0 0;
    font-family:"PT Serif", Georgia, serif;
    font-style:italic;
    font-size:15px;
    max-width:52ch;
    opacity:.92;
  }

  .meta-bar{
    display:flex;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:10px 4px 0;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12px;
    color:var(--ink-faint);
    letter-spacing:.02em;
  }

  .section{
    margin-top:40px;
  }
  .section-tab{
    display:inline-flex;
    align-items:baseline;
    gap:8px;
    background:var(--accent-2);
    color:var(--accent-2-ink);
    padding:5px 12px 6px;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .section-tab .count{
    opacity:.75;
    font-size:11.5px;
  }

  .cards{
    border-top:1px solid var(--line);
    margin-top:2px;
  }

  .entry{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:16px 6px 16px 0;
    border-bottom:1px solid var(--line);
    position:relative;
    transition: background-color .15s ease;
  }
  .entry:hover, .entry:focus-visible{
    background:var(--paper-raised);
  }
  .entry:hover .entry-title, .entry:focus-visible .entry-title{
    color:var(--accent);
  }
  .entry-row{
    display:flex;
    align-items:baseline;
    gap:14px;
  }
  .entry-num{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:13px;
    color:var(--ink-faint);
    width:2ch;
    flex:none;
    padding-top:1px;
  }
  .entry-icon{
    font-size:17px;
    flex:none;
    line-height:1;
  }
  .entry-main{
    flex:1;
    min-width:0;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .entry-title{
    font-family:"PT Serif", Georgia, serif;
    font-weight:700;
    font-size:17px;
    text-wrap:balance;
  }
  .entry-date{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .entry-desc{
    margin:4px 0 0 calc(2ch + 14px + 17px + 14px);
    font-size:14.5px;
    line-height:1.5;
    color:var(--ink-soft);
    max-width:56ch;
  }
  @media (max-width: 480px){
    .entry-desc{ margin-left:0; }
  }

  footer{
    margin-top:52px;
    padding-top:18px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12px;
    color:var(--ink-faint);
  }
</style>
</head>
<body>
<div class="page">

  <div class="drawer">
    <div class="eyebrow">Личный архив · только по ссылке</div>
    <h1>Картотека Витапром</h1>
    <p>Рабочие странички и заметки в одном месте — пополняется по мере появления новых.</p>
  </div>
  <div class="meta-bar">
    <span>0 записей</span>
    <span>обновлено 02.09.2026</span>
  </div>

  <!--
    Шаблон записи — скопировать внутрь .cards нужного раздела:

    <a class="entry" href="pages/имя-файла.html">
      <div class="entry-row">
        <span class="entry-num">01</span>
        <span class="entry-icon">📊</span>
        <span class="entry-main">
          <span class="entry-title">Заголовок</span>
          <span class="entry-date">ДД.ММ.ГГГГ</span>
        </span>
      </div>
      <div class="entry-desc">Короткое описание.</div>
    </a>
  -->

  <div class="section" hidden>
    <div class="section-tab">Раздел <span class="count">· 0</span></div>
    <div class="cards">
    </div>
  </div>

  <footer>
    <span>сайт не индексируется поисковиками (robots.txt) — открыть можно только по прямой ссылке</span>
    <span>картотека пополняется</span>
  </footer>

</div>
</body>
</html>
